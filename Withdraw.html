<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Portal - VIP Wallet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .toast {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            color: white;
            font-size: 0.8rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            animation: fadeIn 0.3s ease-in-out;
            transition: opacity 0.3s ease;
        }
        .toast-success { background-color: #10b981; }
        .toast-error { background-color: #f43f5e; }
        .toast-info { background-color: #0284c7; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-slate-100 flex flex-col justify-between font-sans antialiased">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Top Header Navigation -->
    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700 sticky top-0 z-40 px-4 md:px-6 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-700 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-600 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="font-bold text-white text-base md:text-lg leading-tight">Withdraw Portal</h1>
                <p class="text-[11px] text-amber-400 font-medium">Select Agent & Send Withdraw Request</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-amber-600/20 border border-amber-500/30 flex items-center justify-center text-amber-400">
                <i class="fa-solid fa-money-bill-transfer text-sm"></i>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 p-4 max-w-xl w-full mx-auto my-auto space-y-5">

        <!-- Withdraw Form Card -->
        <div class="bg-slate-800/95 backdrop-blur-sm border border-slate-700 rounded-2xl p-5 md:p-6 shadow-2xl space-y-4">
            
            <div class="border-b border-slate-700 pb-3 flex items-center justify-between">
                <span class="text-xs font-semibold text-slate-300">Withdraw Form</span>
                <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-md font-medium flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> Live Connected
                </span>
            </div>

            <form id="user-withdraw-form" onsubmit="handleUserWithdrawSubmit(event)" class="space-y-4">
                
                <!-- ড্রপডাউন: এজেন্টের নাম -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Select Agent</label>
                    <select id="agent_select" required onchange="handleAgentSelection(this.value)" class="w-full text-xs md:text-sm bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:ring-1 focus:ring-amber-500 transition">
                        <option value="">-- Select Agent --</option>
                    </select>
                </div>

                <!-- সিলেক্টেড এজেন্টের নাম, ইমেইল এবং ব্যালেন্স ডিসপ্লে বক্স -->
                <div id="agent-account-box" class="hidden bg-slate-900/90 border border-amber-500/30 p-4 rounded-xl text-xs space-y-3 shadow-inner">
                    <p class="text-amber-400 font-bold flex items-center gap-1.5 border-b border-slate-800 pb-2">
                        <i class="fa-solid fa-circle-check"></i> Selected Agent Details:
                    </p>
                    
                    <div class="space-y-1.5 text-slate-300">
                        <p><strong>Agent Name:</strong> <span id="info-agent-name" class="text-amber-300 font-semibold">-</span></p>
                        <p><strong>Email:</strong> <span id="info-agent-email" class="text-slate-400 font-mono">-</span></p>
                    </div>

                    <!-- এজেন্টের টোটাল ব্যালেন্স দেখার বক্স -->
                    <div class="bg-slate-950 p-3 rounded-lg border border-amber-500/20 flex items-center justify-between mt-1">
                        <div>
                            <span class="text-[10px] text-amber-400 font-semibold block uppercase tracking-wider">Agent Total Balance:</span>
                            <span id="info-agent-balance" class="text-emerald-400 font-mono font-bold text-base">৳0.00</span>
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                            <i class="fa-solid fa-wallet text-sm"></i>
                        </div>
                    </div>
                </div>

                <!-- ইউজারের রিসিভ করার নম্বর -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Receiver Account Number</label>
                    <input type="text" id="receiver_number" required placeholder="Your Personal Number (01xxxxxxxxx)" class="w-full text-xs md:text-sm bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:ring-1 focus:ring-amber-500 transition">
                </div>

                <!-- টাকার পরিমাণ -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Withdraw Amount BDT</label>
                    <input type="number" step="0.01" id="amount" required placeholder="৳ 0.00" class="w-full text-xs md:text-sm bg-slate-900 border border-slate-700 rounded-xl p-3 text-amber-400 font-bold focus:outline-none focus:ring-1 focus:ring-amber-500 transition">
                </div>

                <!-- সাবমিট বাটন -->
                <button type="submit" id="submit-btn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-amber-600/30 text-xs md:text-sm flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>উইথড্র রিকোয়েস্ট সাবমিট করুন</span>
                </button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800/90 backdrop-blur-md border-t border-slate-700 py-3 text-center text-xs text-slate-400">
        <p>&copy; 2026 VIP Wallet | Agent Withdraw Portal</p>
    </footer>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = 'https://tzgipesjqsrqtwxbwkye.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_AYSEhxP9kZF03QOmQrSDrg_njl68RNf';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let agentsList = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchAgentsList();
        });

        // ১. users টেবিল থেকে এজেন্টদের তথ্য লোড করা
        async function fetchAgentsList() {
            const dropdown = document.getElementById('agent_select');
            try {
                const { data: usersData, error: usersError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (usersError) throw usersError;

                if (!usersData || usersData.length === 0) {
                    dropdown.innerHTML = `<option value="">-- কোনো এজেন্ট পাওয়া যায়নি --</option>`;
                    return;
                }

                agentsList = usersData;

                dropdown.innerHTML = `<option value="">-- Select Agent --</option>`;
                agentsList.forEach((agent, index) => {
                    const option = document.createElement('option');
                    option.value = index; 
                    option.textContent = agent.full_name;
                    dropdown.appendChild(option);
                });

            } catch (err) {
                console.error("Fetch error:", err.message);
                dropdown.innerHTML = `<option value="">-- ডেটা লোড করতে সমস্যা হয়েছে --</option>`;
            }
        }

        // ২. ড্রপডাউন থেকে এজেন্ট সিলেক্ট করলে তার নাম, ইমেইল এবং টোটাল ব্যালেন্স বক্সে দেখানো
        function handleAgentSelection(index) {
            const infoBox = document.getElementById('agent-account-box');
            if (index === "" || agentsList[index] === undefined) {
                infoBox.classList.add('hidden');
                return;
            }

            const agent = agentsList[index];
            document.getElementById('info-agent-name').textContent = agent.full_name;
            document.getElementById('info-agent-email').textContent = agent.email;
            document.getElementById('info-agent-balance').textContent = `৳${parseFloat(agent.balance || 0).toLocaleString('en-US', { minimumFractionDigits: 2 })}`;

            infoBox.classList.remove('hidden');
        }

        // ৩. উইথড্র রিকোয়েস্ট সাবমিট করা
        async function handleUserWithdrawSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const selectedIndex = document.getElementById('agent_select').value;
            const receiverNumber = document.getElementById('receiver_number').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);

            if (selectedIndex === "" || !receiverNumber || isNaN(amount) || amount <= 0) {
                showToast("দয়া করে সকল তথ্য সঠিকভাবে পূরণ করুন!", "error");
                return;
            }

            const chosenAgent = agentsList[selectedIndex];

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> সাবমিট হচ্ছে...`;

            try {
                const currentDate = new Date().toLocaleDateString();
                const currentTimestamp = new Date().toISOString();

                // deposit_withdraw_history টেবিলে type: 'withdraw' হিসেবে ইনসার্ট
                const withdrawPayload = {
                    user_email: chosenAgent.email, 
                    user_name: chosenAgent.full_name,
                    type: 'withdraw',
                    provider: `Agent: ${chosenAgent.full_name}`,
                    account_number: receiverNumber, 
                    trx_id: 'WITHDRAW-' + Math.floor(100000 + Math.random() * 900000), 
                    usdt_amount: 0.00,
                    amount: amount,
                    status: 'Pending',
                    date: currentDate,
                    created_at: currentTimestamp
                };

                const { error: histError } = await supabaseClient
                    .from('deposit_withdraw_history')
                    .insert([withdrawPayload]);

                if (histError) throw histError;

                showToast("আপনার উইথড্র রিকোয়েস্ট সফলভাবে এজেন্টের কাছে জমা হয়েছে!", "success");
                
                // ফর্ম রিসেট
                document.getElementById('user-withdraw-form').reset();
                document.getElementById('agent-account-box').classList.add('hidden');
                fetchAgentsList();

            } catch (err) {
                console.error("Withdraw submission error:", err.message);
                showToast("রিকোয়েস্ট সাবমিট করা সম্ভব হয়নি: " + err.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>উইথড্র রিকোয়েস্ট সাবমিট করুন</span>`;
            }
        }

        // টোস্ট নোটিফিকেশন হেলপার
        function showToast(message, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'success' ? 'toast-success' : type === 'error' ? 'toast-error' : 'toast-info'}`;
            toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;color:white;margin-left:0.5rem;cursor:pointer;">✕</button>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 4000);
        }
    </script>
</body>
</html>
